<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body onload="inicializarDashboard()">

<header>
    <h1>Generador de Recetas IA</h1>

    <button onclick="cerrarSesion()">
        Cerrar Sesión
    </button>
</header>

<div class="container">

    <section>

        <h2>Inventario</h2>

        <input id="nombreIngrediente" placeholder="Ingrediente">

        <input id="cantidadIngrediente" placeholder="Cantidad">

        <input id="unidadIngrediente" placeholder="Unidad">

        <button onclick="agregarIngrediente()">
            Agregar
        </button>

        <div id="ingredientes"></div>

    </section>

    <section>

        <h2>Recetas</h2>

        <button onclick="generarReceta()">
            Generar Receta
        </button>

        <div id="recetas"></div>

    </section>

</div>

<script src="js/app.js"></script>

</body>
</html>
